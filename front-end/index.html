<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Album</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f5f7; color: #1f2933; }
    header { background: #1f2933; color: #fff; padding: 24px 16px; text-align: center; }
    header h1 { margin: 0 0 4px; font-size: 28px; }
    header p { margin: 0; opacity: .8; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { margin-top: 0; font-size: 20px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type=text] { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid #cbd2d9; border-radius: 8px; font-size: 15px; }
    input[type=file] { padding: 8px 0; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #3b82f6; color: #fff; font-size: 15px; cursor: pointer; }
    button:hover { background: #2563eb; }
    .status { margin: 12px 0 0; color: #52606d; min-height: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
    .photo { border: 1px solid #e4e7eb; border-radius: 10px; overflow: hidden; background: #fafbfc; }
    .photo img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .labels { padding: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .labels span { background: #e0ecff; color: #1e40af; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  </style>
</head>
<body>
  <header>
    <h1>📷 Photo Album</h1>
    <p>Search your photos using natural language (CI/CD demo - live update)</p>
  </header>

  <main>
    <section class="card">
      <h2>Search</h2>
      <form id="search-form">
        <input id="search-input" type="text" placeholder='Try "dogs", "show me cats and dogs", or a custom label' required>
        <button type="submit">Search</button>
      </form>
      <p id="search-status" class="status"></p>
      <div id="results" class="grid"></div>
    </section>

    <section class="card">
      <h2>Upload a photo</h2>
      <form id="upload-form">
        <input id="file-input" type="file" accept="image/jpeg,image/png" required>
        <input id="labels-input" type="text" placeholder="Custom labels, comma-separated (e.g. Sam, Sally)">
        <button type="submit">Upload</button>
      </form>
      <p id="upload-status" class="status"></p>
    </section>
  </main>

  <!-- API Gateway generated SDK -->
  <script src="apiGateway-js-sdk/lib/axios/dist/axios.standalone.js"></script>
  <script src="apiGateway-js-sdk/lib/CryptoJS/rollups/crypto-js.js"></script>
  <script src="apiGateway-js-sdk/lib/CryptoJS/rollups/sha256.js"></script>
  <script src="apiGateway-js-sdk/lib/CryptoJS/components/hmac.js"></script>
  <script src="apiGateway-js-sdk/lib/CryptoJS/components/enc-base64.js"></script>
  <script src="apiGateway-js-sdk/lib/url-template/url-template.js"></script>
  <script src="apiGateway-js-sdk/lib/apiGatewayCore/sigV4Client.js"></script>
  <script src="apiGateway-js-sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script src="apiGateway-js-sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script src="apiGateway-js-sdk/lib/apiGatewayCore/utils.js"></script>
  <script src="apiGateway-js-sdk/apigClient.js"></script>

  <script src="app.js"></script>
</body>
</html>
